services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ai-output:/data/output
    environment:
      # Lower this for quick local testing with small/cropped screenshots;
      # keep it at 512 (or higher) for real product photos.
      AI_MIN_IMAGE_RESOLUTION: "512"

  backend:
    build:
      context: ./backend/src
      dockerfile: Api/Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - backend-storage:/app/storage
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=platform;Username=platform;Password=changeme"
      AiService__BaseUrl: "http://ai-service:8000"
      Storage__PublicBaseUrl: "http://localhost:5000/storage"
      Storage__InternalBaseUrl: "http://backend:8080/storage"
      Viewer__BaseUrl: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:5000"
    depends_on:
      - backend

volumes:
  postgres-data:
  ai-output:
  backend-storage:
